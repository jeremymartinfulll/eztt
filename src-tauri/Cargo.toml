[package]
name = "eztt"
version = "0.1.0"
description = "Déclenche des actions API selon le Wi-Fi connecté"
authors = ["Jeremy Martin"]
edition = "2024"

[lib]
name = "eztt_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "time"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
